services:
  frontend:
    build:
      context: ./frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "127.0.0.1:5180:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      NGROK_DOMAIN: ${NGROK_DOMAIN:-}
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ./backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    # MySQL の初回初期化中は接続に失敗することがあるため、失敗時は自動で再起動する。
    restart: on-failure
    ports:
      - "127.0.0.1:8080:8000"
    volumes:
      - ./backend:/app
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure-secret-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-insta_curator}
      MYSQL_USER: ${MYSQL_USER:-insta_curator}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-insta_curator_password}
      IG_USER_ID: ${IG_USER_ID:-}
      IG_ACCESS_TOKEN: ${IG_ACCESS_TOKEN:-}
      IG_GRAPH_API_VERSION: ${IG_GRAPH_API_VERSION:-v27.0}
      IG_MEDIA_LIMIT: ${IG_MEDIA_LIMIT:-12}
      IG_MIN_FETCH_INTERVAL_MINUTES: ${IG_MIN_FETCH_INTERVAL_MINUTES:-30}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    ports:
      - "127.0.0.1:3308:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-insta_curator}
      MYSQL_USER: ${MYSQL_USER:-insta_curator}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-insta_curator_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # スマホから使うときだけ起動する: docker compose --profile mobile up
  # 認証なしで公開されるため、使い終わったら止める。
  ngrok:
    image: ngrok/ngrok:3.39.9-alpine
    profiles: ["mobile"]
    command:
      - http
      - --url=https://${NGROK_DOMAIN:-}
      - --inspect=false
      - http://frontend:5173
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  frontend_node_modules:
  mysql_data:
